name: Deploy code on Excloude

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Excloude
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 210.79.128.197
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/EXC_TEST
            git pull origin main
            npm install
            pm2 restart 1
